<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>My Money</title>
<style>
:root{--seg:#1a1a1a;--on:#363636;--sheet:#141414;--chip:#222;--tx:#f5f5f7;--mut:#777;--red:#ff5f5f;--grn:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--tx);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color-scheme:dark}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 22px 0}
.seg{display:inline-flex;background:var(--seg);border-radius:30px;padding:3px}
.seg button{padding:5px 20px;border-radius:30px;color:var(--mut);font-size:13px;font-weight:500}
.seg .on{background:var(--on);color:var(--tx)}
.ico{width:23px;height:23px;stroke:#d0d0d0;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#home{padding:50px 0 140px;text-align:center}
.period{color:var(--mut);font-size:12px}
.total{font-size:40px;font-weight:600;letter-spacing:-1px;line-height:1.2;margin:8px 0 12px}
.bl{color:var(--mut);font-size:12px;min-height:16px;display:block;margin:0 auto}
.bl.over{color:var(--red)}
canvas{width:100%;height:225px;display:block;margin-top:26px}
#rangeSeg{margin:0 0 26px;background:none}
#rangeSeg button{padding:6px 17px}
.row{display:flex;align-items:center;gap:12px;padding:10px 34px;width:100%;text-align:left}
.badge{width:30px;height:30px;border-radius:8px;background:var(--seg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;line-height:1.15}
.badge small{font-size:7px;color:var(--mut);letter-spacing:.6px;font-weight:500}
.n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.a{font-size:15px}.a.income{color:var(--grn)}
.mr{padding:15px 34px}.chev{color:var(--mut);font-size:20px}
.empty{color:var(--mut);padding:40px 0}
#fab{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:#383838;display:grid;place-items:center;z-index:5}
#fab svg{width:34px;height:34px;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
.page{position:fixed;inset:0;background:#000;overflow-y:auto;transform:translateX(100%);transition:transform .25s;z-index:20;padding:calc(env(safe-area-inset-top) + 18px) 22px 40px;visibility:hidden}
.page.open{transform:none;visibility:visible}
.top{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.top .ttl{font-weight:600;font-size:15px}
#insTabs{flex:1}#insTabs button{flex:1;padding:6px 4px}
.srow{display:flex;gap:14px;align-items:center;padding:12px 0}
.srow>div{flex:1}.sl{display:flex;justify-content:space-between;margin-bottom:8px}.sl em{font-style:normal;color:#bbb}
.bar{height:8px;background:var(--seg);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px}
.icard{background:var(--seg);border-radius:20px;padding:18px;margin-bottom:12px}.icard small{color:var(--mut);display:block;margin-bottom:6px}.icard b{font-size:21px;font-weight:600}
.av{width:70px;height:70px;border-radius:50%;background:#1c1c1c;border:1px solid #2a2a2a;margin:14px auto 14px;display:grid;place-items:center;font-size:24px;color:#999}
.nm{display:block;margin:0 auto;font-size:17px}.em{text-align:center;color:var(--mut);font-size:12px;margin:6px 0 24px}
.menu{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-bottom:1px solid #1d1d1d;font-size:14px;background:#0b0b0b;text-align:left}
.menu:first-of-type{border-radius:30px 30px 0 0}.menu:last-of-type{border:0;border-radius:0 0 30px 30px}
.menu.red{color:#f87171}.ver{text-align:center;color:var(--mut);margin-top:22px;font-size:12px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-radius:34px 34px 0 0;transform:translateY(105%);transition:transform .28s;z-index:31;padding:14px 24px calc(env(safe-area-inset-bottom) + 20px);max-height:94%;overflow-y:auto}
.sheet.open{transform:none}
.hd{width:36px;height:4px;border-radius:3px;background:#444;margin:0 auto 14px}
.del{position:absolute;right:26px;top:26px;color:#f87171;font-size:13px}
.mid{display:flex;width:max-content;margin:0 auto;background:#222}.mid .on{background:var(--on)}
.amt{text-align:center;font-size:48px;font-weight:300;margin:26px 0 4px}.amt span{font-size:26px;color:#999;margin-right:6px}.amt.z{color:#888}
.note{display:block;width:100%;background:none;border:0;color:var(--tx);text-align:center;font-size:14px;outline:0;margin:22px 0 44px}
.note::placeholder{color:#555}
.sheet.p .amt{font-size:36px;margin:8px 0}.sheet.p .note{margin:4px 0 14px}
.chips{display:flex;justify-content:space-around;margin-bottom:6px}.chip{padding:10px;font-size:14px}.chip .e{font-size:19px;margin-right:4px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);row-gap:0;text-align:center}
.keys button{height:66px;font-size:24px;font-weight:500}
.save{background:#d4d4d4;color:#000;border-radius:30px;font-size:16px!important;font-weight:600;height:50px!important}
.save.wide{width:100%;margin-top:20px;height:48px!important}
.cats{background:#222;border-radius:24px;max-height:44vh;overflow-y:auto}
.crow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;font-size:15px;border-bottom:1px solid #2c2c2c;text-align:left}
.crow:last-child{border:0}.ce{font-size:20px;width:26px;text-align:center}.cn{flex:1}.crow i{width:10px;height:10px;border-radius:4px}.crow b{width:16px}
.cal{padding:0 4px}.ch{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin:6px 0 10px}.ch button{font-size:22px;padding:0 14px}.ch button:disabled{color:#444}
.cg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:6px}
.cg small{color:var(--mut);font-size:12px;padding:6px}.cg button{height:34px;width:34px;margin:auto;border-radius:50%;font-size:15px}
.cg .sel{background:#fff;color:#000}.cg .fut{color:#4a4a4a}
h3{text-align:center;font-size:17px;margin:6px 0}.sub{text-align:center;color:var(--mut);font-size:13px;margin:0 0 16px}
.big{text-align:center;font-size:38px;font-weight:300;margin:22px 0 6px}
.rwrap{position:relative}.ruler{overflow-x:scroll;scrollbar-width:none;margin:0 -24px}.ruler::-webkit-scrollbar{display:none}
.rail{display:block;width:max-content;padding:0 50%;box-sizing:content-box}
.ticks{height:16px;margin-top:8px;background:repeating-linear-gradient(90deg,#555 0 1px,transparent 1px 9px)}
.ind{position:absolute;left:50%;top:0;width:2px;height:32px;margin-left:-1px;background:var(--grn);border-radius:2px;pointer-events:none}
.kl{text-align:center;color:var(--mut);font-size:12px;margin:8px 0 26px}
.last{border:1px solid #2a2a2a;border-radius:22px;padding:16px}.last small{color:var(--mut);font-size:11px;letter-spacing:1.5px}.last div{margin:8px 0 2px;font-size:15px}
.menu[hidden]{display:none}.fi{display:block;width:100%;background:#222;border:0;border-radius:18px;color:var(--tx);font-size:15px;padding:13px 16px;margin:0 0 10px;outline:0}.msg{text-align:center;color:var(--mut);min-height:22px;margin:4px 0 12px}.ghost{width:100%;height:44px;color:#bbb;font-size:15px}
.ok,.bad{font-size:13px}.ok{color:var(--grn);margin:6px 0 0}.bad{color:var(--red);margin:6px 0 0}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #222}.rrow .n small{display:block;color:var(--mut);font-size:11px;margin-top:2px}.rrow button{padding:6px 4px}
/* fixed layout: only the transaction list scrolls; no double-tap zoom */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;position:fixed;inset:0;width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button,label{touch-action:manipulation}
header{flex:none}
#home{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:50px 0 0}
#home>*{flex:none}
#list{flex:1 1 auto;min-height:0;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:120px}
.gcard{background:var(--seg);border-radius:20px;padding:16px;margin-bottom:12px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}.gh b{font-size:15px}.gh span{color:#bbb;font-size:13px}
.gf{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--mut)}.gf small{flex:1;font-size:12px}
.gf button{font-size:13px;padding:6px 12px;border-radius:16px;background:#2a2a2a}.gf .pri{background:#d4d4d4;color:#000;font-weight:600}
.lab{color:var(--mut);font-size:12px;margin:0 0 6px 4px}
.gcard .bar{background:#2e2e2e}
#menuBtn{position:relative}#menuBtn.dot::after{content:"";position:absolute;top:-1px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.hl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#bbb;padding:6px 0;border-top:1px solid #262626}
.cwrap{position:relative;overflow:hidden;border-bottom:1px solid #2c2c2c}.cwrap .crow{border:0;position:relative;background:#222;transition:transform .2s;touch-action:pan-y}
.cact{position:absolute;right:0;top:0;bottom:0;display:flex}.cact button{width:70px;color:#fff;font-size:13px}.cact button:first-child{background:#4b5563}.cact button:last-child{background:#ef4444}
.rv{margin-left:auto;color:var(--mut);font-size:13px}
</style></head><body>
<header>
<button id="menuBtn" aria-label="Insights"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M3 12h13M3 18h18"/></svg></button>
<div class="seg" id="typeSeg"><button data-t="expense" class="on">Expense</button><button data-t="income">Income</button></div>
<button id="walletBtn" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h11v3M4 7v10a2 2 0 0 0 2 2h13a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H6a2 2 0 0 1-2-1zM16 13.5h2"/></svg></button>
</header>
<main id="home">
<div class="period" id="period"></div><div class="total" id="total"></div><button class="bl" id="bl"></button>
<canvas id="chart"></canvas>
<div class="seg" id="rangeSeg"><button data-r="1M" class="on">1M</button><button data-r="1Y">1Y</button><button data-r="All">All</button></div>
<div id="list"></div>
</main>
<button id="fab" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button>

<section class="page" id="insights"><div class="top"><button data-close aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div class="seg" id="insTabs"><button data-tab="insights" class="on">Insights</button><button data-tab="spending">Spending</button><button data-tab="savings">Savings</button><button data-tab="loans">Loans</button><button data-tab="invest">Invest</button></div></div><div id="insBody"></div></section>

<section class="page" id="settings"><div class="top"><button data-close aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ttl">Settings</span></div>
<div class="av">👤</div><button class="nm" id="nm"></button><div class="em">Data is stored on this device</div>
<button class="menu" id="acct">☁️ Sign in to sync</button>
<button class="menu" id="rcBtn">🔁 Recurring</button>
<button class="menu" id="remBtn">📅 Monthly reminder</button>
<button class="menu" id="dailyBtn">🔔 Daily reminder<span class="rv" id="dailyVal">Off</span></button>
<button class="menu" id="bk">⬇️ Backup Data</button>
<label class="menu">⬆️ Import Data<input type="file" id="imp" accept=".json,application/json" hidden></label>
<button class="menu" id="lo" hidden>🚪 Log Out</button>
<button class="menu red" id="er">🗑️ Erase Data</button><div class="ver">v2.0.0</div></section>

<div id="scrim"></div><div class="sheet" id="sheet"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body></html>
